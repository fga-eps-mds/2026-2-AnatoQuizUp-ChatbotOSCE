services:
  chatbot-osce:
    build: .
    container_name: anatoquizup-chatbot-osce
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3335}
      # Libera o Web em Docker (8080) alem do dev server (5173).
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "${PORT:-3335}:${PORT:-3335}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
